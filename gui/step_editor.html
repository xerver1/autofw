<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>步骤录入 · 截图标记与判定</title>
<style>
  /* Glassmorphism Design System - token 同控制台 */
  :root {
    --bg-deep:#F3F1EB; --glass-card:#FCFBF8; --glass-strong:#FFFFFF;
    --glass-input:#FFFFFF; --glass-btn:rgba(44,47,42,0.06); --glass-hover:rgba(44,47,42,0.10);
    --border-glass:rgba(44,47,42,0.09); --border-bright:rgba(44,47,42,0.20);
    --gold:#75846C; --gold-text:#5E6B55; --moon:#6B7267;
    --text:#2C2F2A; --text-80:rgba(44,47,42,0.80); --text-50:rgba(44,47,42,0.55); --text-35:rgba(44,47,42,0.35);
    --ok:#5E8B6E; --err:#BC5F51;
    --spring:cubic-bezier(0.16,1,0.3,1);
    --shadow-card:0 2px 4px rgba(44,47,42,0.05), 0 12px 28px rgba(44,47,42,0.06);
    --shadow-btn:0 2px 4px rgba(44,47,42,0.06), 0 6px 16px rgba(44,47,42,0.08);
    --shadow-btn-hover:0 4px 8px rgba(44,47,42,0.08), 0 14px 30px rgba(44,47,42,0.12);
    --shadow-input:inset 0 1px 0 rgba(44,47,42,0.04);
    --shadow-focus:0 0 0 3px rgba(117,132,108,0.18), 0 8px 24px rgba(44,47,42,0.12);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--text); font-size: 14.5px; line-height: 1.65;
    background:
      radial-gradient(640px circle at 85% 10%, rgba(124,156,196,0.38), transparent 60%),
      radial-gradient(560px circle at 10% 90%, rgba(51,81,122,0.45), transparent 60%),
      radial-gradient(480px circle at 50% 45%, rgba(228,184,99,0.12), transparent 55%),
      var(--bg-deep);
    background-attachment: fixed;
  }
  /* 噪点层已移除（v3.0.1）：原 feTurbulence 覆盖层在部分浏览器渲染过重导致满屏噪点。
     如需保留玻璃颗粒质感，可用弱化参数：opacity:0.06 + baseFrequency 0.9 + numOctaves 1 */
  .wrap { max-width: 960px; margin: 0 auto; padding: 28px 24px 80px; position: relative; z-index: 1; }

  header {
    display:flex; justify-content:space-between; align-items:flex-end; flex-wrap:wrap; gap:12px;
    background:var(--glass-strong); backdrop-filter:blur(20px) saturate(180%);
    -webkit-backdrop-filter:blur(20px) saturate(180%);
    border:1px solid var(--border-glass); border-radius:20px; box-shadow:var(--shadow-card);
    padding:18px 24px; margin-bottom:24px;
  }
  header h1 { font-size:21px; font-weight:600; }
  header .sub { color:var(--text-50); font-size:13px; margin-top:4px; }
  header .links a { color:var(--text-50); font-size:13px; margin-left:14px; text-decoration:none; transition:color 500ms var(--spring); }
  header .links a:hover { color:var(--gold-text); }

  h2 { font-size:15px; font-weight:600; margin:32px 0 12px; color:var(--text); }
  .card {
    background:var(--glass-card); backdrop-filter:blur(28px) saturate(180%);
    -webkit-backdrop-filter:blur(28px) saturate(180%);
    border:1px solid var(--border-glass); border-radius:20px; box-shadow:var(--shadow-card);
    background-image:linear-gradient(to bottom, rgba(255,255,255,0.05), transparent 50%);
    padding:20px 22px; margin-bottom:16px;
  }

  #drop { border:1.5px dashed var(--border-bright); border-radius:16px; padding:32px; text-align:center; color:var(--text-50); cursor:pointer; transition:all 500ms var(--spring); }
  #drop:hover { background:var(--glass-hover); border-color:rgba(228,184,99,0.5); }
  #drop input { display:none; }
  #uploadHint { margin-top:8px; font-size:12.5px; color:var(--text-50); }

  #previewWrap { position:relative; display:none; border:1px solid var(--border-glass); border-radius:16px; background:rgba(3,7,18,0.4); overflow:hidden; user-select:none; }
  #preview { display:block; max-width:100%; height:auto; }
  .marker { position:absolute; width:14px; height:14px; margin:-7px 0 0 -7px; border-radius:50%; background:var(--err); border:2px solid #fff; box-shadow:0 0 0 1.5px var(--err); cursor:grab; }
  .marker .coord { position:absolute; top:16px; left:10px; white-space:nowrap; font-size:11.5px; font-family:Consolas,monospace; color:#fff; background:rgba(6,10,19,0.75); padding:1px 6px; border-radius:6px; }
  .marker .del { position:absolute; top:-6px; right:-6px; width:16px; height:16px; line-height:14px; text-align:center; font-size:11px; background:rgba(6,10,19,0.85); color:#fff; border-radius:50%; cursor:pointer; display:none; }
  .marker:hover .del { display:block; }
  #markHint { font-size:12.5px; color:var(--text-50); margin-top:8px; }

  .verdict-row { display:flex; gap:24px; align-items:center; flex-wrap:wrap; margin:12px 0; }
  .verdict-row label { display:flex; align-items:center; gap:8px; cursor:pointer; color:var(--text-80); }
  input[type="radio"] { accent-color: var(--gold); }
  input[type="text"], textarea {
    width:100%; border:1px solid var(--border-glass); border-radius:14px;
    background:var(--glass-input); backdrop-filter:blur(20px) saturate(180%);
    -webkit-backdrop-filter:blur(20px) saturate(180%);
    padding:9px 12px; font-size:14px; font-family:inherit; color:var(--text);
    box-shadow:var(--shadow-input);
    transition:all 500ms var(--spring);
  }
  input::placeholder, textarea::placeholder { color:var(--text-35); }
  input:focus, textarea:focus { outline:none; border-color:var(--border-bright); background:var(--glass-hover); box-shadow:var(--shadow-focus); }
  textarea { min-height:56px; resize:vertical; }
  .note-row { margin:12px 0; }
  .note-row label { font-size:13px; color:var(--text-50); display:block; margin-bottom:6px; }

  button {
    border:1px solid var(--border-glass); border-radius:14px;
    background:var(--glass-btn); backdrop-filter:blur(20px) saturate(180%);
    -webkit-backdrop-filter:blur(20px) saturate(180%);
    color:var(--text); font-size:14px; font-family:inherit; cursor:pointer; padding:10px 26px;
    box-shadow:var(--shadow-btn); transition:all 500ms var(--spring);
  }
  button:hover:not(:disabled) { background:var(--glass-hover); border-color:var(--border-bright); transform:translateY(-2px); box-shadow:var(--shadow-btn-hover); }
  button:active:not(:disabled) { transform:scale(0.97); }
  button:focus-visible { outline:none; box-shadow:var(--shadow-focus); }
  button:disabled { opacity:.4; cursor:not-allowed; }
  button.ghost { background:var(--glass-input); }
  button.mini { background:var(--glass-input); color:var(--text-80); padding:4px 12px; font-size:12.5px; border-radius:10px; }
  button.mini:hover { border-color:var(--border-bright); color:var(--text); }

  .banner { display:none; padding:14px 18px; margin:16px 0; border-radius:14px; font-size:14px; border:1px solid; }
  .banner.ok { display:block; background:rgba(127,209,168,0.1); border-color:rgba(127,209,168,0.3); color:var(--ok); }
  .banner.fail { display:block; background:rgba(229,142,142,0.1); border-color:rgba(229,142,142,0.3); color:var(--err); }
  .banner .meta { font-size:12.5px; margin-top:6px; color:var(--text-50); font-family:Consolas,monospace; }

  table { width:100%; border-collapse:collapse; font-size:13.5px; }
  th { text-align:left; font-weight:600; border-bottom:1.5px solid var(--border-glass); padding:8px 6px; font-size:12.5px; color:var(--text-50); }
  td { padding:8px 6px; border-bottom:1px solid rgba(255,255,255,0.1); vertical-align:top; color:var(--text-80); }
  .tag { display:inline-block; font-size:11.5px; padding:1px 8px; border-radius:999px; }
  .tag.s { background:rgba(127,209,168,0.12); color:var(--ok); }
  .tag.f { background:rgba(229,142,142,0.12); color:var(--err); }
  .tag.p { background:rgba(228,184,99,0.12); color:var(--gold-text); }
  tr.row-click { cursor:pointer; }
  tr.row-click:hover td { background:rgba(255,255,255,0.05); }
  .detail { display:none; background:rgba(255,255,255,0.04); padding:14px 16px; font-size:13px; color:var(--text-80); border-radius:12px; }
  .detail img { max-width:420px; border:1px solid var(--border-glass); border-radius:12px; margin-top:8px; display:block; }

  .err { color:var(--err); font-size:13px; margin-top:10px; display:none; }
  footer { margin-top:48px; border-top:1px solid rgba(255,255,255,0.12); padding-top:16px; font-size:12px; color:var(--text-50); display:flex; justify-content:space-between; }

  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation:none !important; transition:none !important; } }
  @media (max-width: 640px) { .wrap { padding: 20px 14px 60px; } header { flex-direction: column; align-items: flex-start; } }
</style>
</head>
<body>
<div class="wrap">

<header>
  <div>
    <h1>步骤录入 · 截图标记与判定</h1>
    <div class="sub">手动提交每一步点击的按键截图 → 标记点击位置 → 判定成功/失败 → 失败自动暂停供排查</div>
  </div>
  <div class="links">
    <a href="/">← 控制面板</a>
    <a href="/pipeline_editor.html">流水线编排</a>
  </div>
</header>

<div class="banner" id="pauseBanner">
  <b>流程已暂停</b> — 最近一次点击判定为失败。请查看下方台账中该次提交的截图、坐标与备注排查原因，确认后可恢复流程。
  <div class="meta" id="pauseMeta"></div>
  <div style="margin-top:10px"><button class="ghost" id="btnResume">恢复流程</button></div>
</div>

<h2>1 · 提交截图</h2>
<div class="card">
  <div id="drop">
    点击或拖拽选择截图（PNG / JPEG）
    <input type="file" id="fileInput" accept="image/png,image/jpeg">
  </div>
  <div id="uploadHint">选择后将在下方预览并标记点击位置</div>
  <div class="err" id="uploadErr"></div>
</div>

<h2>2 · 标记点击位置</h2>
<div class="card">
  <div id="previewWrap">
    <img id="preview" alt="preview">
  </div>
  <div id="markHint">在截图上点击添加标记点（红色圆点）；拖动可微调位置；悬停标记点可删除。坐标将显示在标记点旁。</div>
</div>

<h2>3 · 判定与提交</h2>
<div class="card">
  <div class="verdict-row">
    <label><input type="radio" name="verdict" value="success" checked> 点击成功</label>
    <label><input type="radio" name="verdict" value="fail"> 点击失败（暂停排查）</label>
  </div>
  <div class="note-row">
    <label>界面表现备注（失败时说明预期与实际的差异，便于排查）</label>
    <textarea id="note" placeholder="例如：点击后应弹出 X 界面，实际无响应 / 弹出了错误提示…"></textarea>
  </div>
  <button id="btnSubmit">提交本次操作</button>
  <div class="banner" id="submitBanner"></div>
  <div class="err" id="submitErr"></div>
</div>

<h2>4 · 操作台账</h2>
<div class="card">
  <table>
    <thead><tr><th>时间</th><th>名称</th><th>点击坐标</th><th>判定</th><th>状态</th></tr></thead>
    <tbody id="ledgerBody"></tbody>
  </table>
  <div class="err" id="ledgerErr"></div>
</div>

<footer><span>autofw · 步骤录入</span><span id="footCount"></span></footer>
</div>

<script>
const $ = (id) => document.getElementById(id);
let imgEl = null, imgW = 0, imgH = 0, markers = [];

function showErr(el, msg) { el.textContent = msg; el.style.display = "block"; }
function hideErr(el) { el.style.display = "none"; }

/* ---- 上传 ---- */
$("drop").addEventListener("click", () => $("fileInput").click());
$("drop").addEventListener("dragover", (e) => e.preventDefault());
$("drop").addEventListener("drop", (e) => {
  e.preventDefault();
  if (e.dataTransfer.files.length) loadFile(e.dataTransfer.files[0]);
});
$("fileInput").addEventListener("change", (e) => {
  if (e.target.files.length) loadFile(e.target.files[0]);
});

function loadFile(file) {
  hideErr($("uploadErr"));
  if (!/^image\/(png|jpeg)$/.test(file.type)) {
    showErr($("uploadErr"), "不支持的文件格式：" + (file.type || "未知") + "，仅支持 PNG/JPEG");
    return;
  }
  if (file.size > 8 * 1024 * 1024) {
    showErr($("uploadErr"), "文件过大（" + (file.size / 1024 / 1024).toFixed(1) + "MB），上限 8MB");
    return;
  }
  $("uploadHint").textContent = "正在读取：" + file.name + "（" + (file.size / 1024).toFixed(1) + " KB）...";
  const reader = new FileReader();
  reader.onload = () => {
    imgEl = new Image();
    imgEl.onload = () => {
      imgW = imgEl.naturalWidth; imgH = imgEl.naturalHeight;
      $("preview").src = reader.result;
      $("previewWrap").style.display = "block";
      markers = [];
      renderMarkers();
      $("uploadHint").textContent = "已加载：" + file.name + "（" + imgW + "×" + imgH + "）—— 点击截图添加标记点";
      hideErr($("submitErr"));
    };
    imgEl.src = reader.result;
  };
  reader.readAsDataURL(file);
}

/* ---- 标记 ---- */
$("previewWrap").addEventListener("click", (e) => {
  if (e.target.classList.contains("marker") || e.target.classList.contains("del")) return;
  const rect = $("preview").getBoundingClientRect();
  const x = Math.round((e.clientX - rect.left) / rect.width * imgW);
  const y = Math.round((e.clientY - rect.top) / rect.height * imgH);
  if (x < 0 || y < 0 || x >= imgW || y >= imgH) return;
  markers.push({ x, y });
  renderMarkers();
});

function renderMarkers() {
  const wrap = $("previewWrap");
  wrap.querySelectorAll(".marker").forEach((m) => m.remove());
  const rect = $("preview").getBoundingClientRect();
  markers.forEach((m, i) => {
    const el = document.createElement("div");
    el.className = "marker";
    const px = m.x / imgW * rect.width, py = m.y / imgH * rect.height;
    el.style.left = px + "px"; el.style.top = py + "px";
    el.innerHTML = '<span class="coord">(' + m.x + ',' + m.y + ')</span><span class="del" title="删除标记">×</span>';
    el.querySelector(".del").addEventListener("click", (ev) => { ev.stopPropagation(); markers.splice(i, 1); renderMarkers(); });
    let drag = false;
    el.addEventListener("mousedown", (ev) => {
      ev.stopPropagation(); drag = true;
      const move = (ev2) => {
        const r = $("preview").getBoundingClientRect();
        const nx = Math.round((ev2.clientX - r.left) / r.width * imgW);
        const ny = Math.round((ev2.clientY - r.top) / r.height * imgH);
        if (nx >= 0 && ny >= 0 && nx < imgW && ny < imgH) { m.x = nx; m.y = ny; renderMarkers(); }
      };
      const up = () => { drag = false; window.removeEventListener("mousemove", move); window.removeEventListener("mouseup", up); };
      window.addEventListener("mousemove", move);
      window.addEventListener("mouseup", up);
    });
    wrap.appendChild(el);
  });
  $("markHint").textContent = markers.length
    ? "已标记 " + markers.length + " 个点击位置：" + markers.map((m) => "(" + m.x + "," + m.y + ")").join(" ")
    : "在截图上点击添加标记点（红色圆点）；拖动可微调位置；悬停标记点可删除。";
}

/* ---- 提交 ---- */
$("btnSubmit").addEventListener("click", async () => {
  hideErr($("submitErr"));
  $("submitBanner").style.display = "none";
  if (!imgEl) { showErr($("submitErr"), "请先上传截图"); return; }
  if (!markers.length) { showErr($("submitErr"), "请至少标记一个点击位置"); return; }
  const verdict = document.querySelector('input[name="verdict"]:checked').value;
  const canvas = document.createElement("canvas");
  canvas.width = imgW; canvas.height = imgH;
  canvas.getContext("2d").drawImage(imgEl, 0, 0);
  const imageB64 = canvas.toDataURL("image/png").split(",")[1];
  const body = {
    image_b64: imageB64,
    name: "step",
    points: markers.map((m) => [m.x, m.y]),
    verdict,
    note: $("note").value
  };
  $("btnSubmit").disabled = true;
  try {
    const r = await fetch("/api/steps/submit", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    });
    const j = await r.json();
    if (!j.ok) { showErr($("submitErr"), j.error || "提交失败"); return; }
    const b = $("submitBanner");
    b.className = "banner " + (j.paused ? "fail" : "ok");
    b.innerHTML = j.msg + '<div class="meta">记录 ID: ' + j.id + '</div>';
    b.style.display = "block";
    $("note").value = "";
    refreshLedger();
  } catch (e) {
    showErr($("submitErr"), "网络错误：" + e.message);
  } finally {
    $("btnSubmit").disabled = false;
  }
});

/* ---- 台账 ---- */
async function refreshLedger() {
  try {
    const r = await fetch("/api/steps");
    const j = await r.json();
    $("footCount").textContent = "共 " + j.count + " 条记录";
    const pb = $("pauseBanner");
    if (j.paused) {
      const last = j.records.filter((x) => x.verdict === "fail").pop();
      if (last) $("pauseMeta").textContent = "时间 " + last.time + " · 坐标 " + last.points.map((p) => "(" + p[0] + "," + p[1] + ")").join(" ") + (last.note ? " · 备注：" + last.note : "");
      pb.style.display = "block";
    } else {
      pb.style.display = "none";
    }
    const tb = $("ledgerBody");
    tb.innerHTML = "";
    if (!j.records.length) { tb.innerHTML = '<tr><td colspan="5" style="color:var(--text-35)">暂无记录</td></tr>'; return; }
    j.records.slice().reverse().forEach((rec) => {
      const tr = document.createElement("tr");
      tr.className = "row-click";
      tr.innerHTML =
        '<td>' + rec.time + '</td>' +
        '<td>' + (rec.name || "step") + '</td>' +
        '<td style="font-family:Consolas,monospace">' + rec.points.map((p) => "(" + p[0] + "," + p[1] + ")").join(" ") + '</td>' +
        '<td><span class="tag ' + (rec.verdict === "success" ? "s" : "f") + '">' + (rec.verdict === "success" ? "成功" : "失败") + '</span></td>' +
        '<td>' + (rec.paused ? '<span class="tag p">已暂停</span>' : '<span class="tag s">正常</span>') + '</td>';
      const detail = document.createElement("tr");
      detail.style.display = "none";
      detail.innerHTML = '<td colspan="5"><div class="detail">记录 ' + rec.id + ' · 时间 ' + rec.time +
        '<br>点击坐标：' + rec.points.map((p) => "(" + p[0] + "," + p[1] + ")").join(" ") +
        (rec.note ? '<br>备注：' + rec.note : "") +
        '<br><img src="/api/steps/' + rec.id + '/image"></div></td>';
      tr.addEventListener("click", () => { detail.style.display = detail.style.display === "none" ? "table-row" : "none"; });
      tb.appendChild(tr);
      tb.appendChild(detail);
    });
  } catch (e) {
    showErr($("ledgerErr"), "台账加载失败：" + e.message);
  }
}

/* ---- 恢复流程 ---- */
$("btnResume").addEventListener("click", async () => {
  const r = await fetch("/api/steps/resume", { method: "POST" });
  const j = await r.json();
  refreshLedger();
});

refreshLedger();
setInterval(refreshLedger, 5000);
</script>
</body>
</html>
